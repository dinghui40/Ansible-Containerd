[defaults]
# 主机清单文件
inventory            = hosts.ini
# 精简回调: 只输出实际执行的任务, 完整输出可临时追加 -v
stdout_callback      = compact
callback_plugins     = ./callback_plugins
# 跳过首次连接的主机指纹确认
host_key_checking    = False
# 不生成 .retry 文件
retry_files_enabled  = False
# 不输出弃用提示
deprecation_warnings = False
# 自动探测目标机 Python 解释器, 探测过程静默
interpreter_python   = auto_silent
